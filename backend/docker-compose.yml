version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: sheepai-postgres
    environment:
      POSTGRES_USER: sheepai
      POSTGRES_PASSWORD: sheepai_password
      POSTGRES_DB: sheepai_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sheepai"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:

